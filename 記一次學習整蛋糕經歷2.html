<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 卡通甜品王國：詞語學習寶典 🍩</title>
    <style>
        :root {
            --bg-color: #FFF5E6;
            --main-card-bg: #FFFFFF;
            --primary-color: #FF8C42;
            --secondary-color: #FFD166;
            --accent-color: #06D6A0;
            --text-color: #4A3E3D;
            --pink-accent: #FFB3C6;
            --canto-color: #8E44AD;
            --sound-btn-bg: #E1F5FE;
            --sound-btn-border: #03A9F4;
            --font-family: 'Segoe UI', "Microsoft JhengHei", "PingFang HK", sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            background-image: radial-gradient(#FFD166 15%, transparent 16%), radial-gradient(#FFB3C6 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid var(--secondary-color);
            padding: 25px;
            box-sizing: border-box;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin: 10px 0;
            text-shadow: 2px 2px 0px #FFE5D9;
        }

        /* 導覽按鈕 (Tab Navigation) */
        .nav-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: #FFF0F5;
            border: 2px solid var(--pink-accent);
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 var(--pink-accent);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            background-color: var(--secondary-color);
            color: #fff;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 0 #D96B27;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 1) 詞義與例句卡片 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .word-card {
            background: #FFF9F2;
            border: 2px solid #FFE0B2;
            border-radius: 16px;
            padding: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .word-card h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1.4rem;
            border-bottom: 2px dashed var(--secondary-color);
            padding-bottom: 5px;
        }

        .word-card p {
            margin: 8px 0;
            line-height: 1.5;
            font-size: 0.98rem;
        }

        /* 按鈕區塊 */
        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        /* 🔊 廣東話語音 Sound 按鈕 */
        .btn-sound {
            background-color: var(--sound-btn-bg);
            border: 2px solid var(--sound-btn-border);
            color: #0277BD;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-sound:hover {
            background-color: #B3E5FC;
        }

        .btn-canto-toggle {
            background-color: #F3E5F5;
            border: 2px solid #CE93D8;
            color: var(--canto-color);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-canto-toggle:hover {
            background-color: #E1BEE7;
        }

        .canto-box {
            display: none;
            background-color: #F8F0FB;
            border-left: 4px solid var(--canto-color);
            padding: 10px;
            margin-top: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 0.92rem;
            color: #4A148C;
            animation: fadeIn 0.3s;
        }

        /* 2 & 3) 題目樣式 */
        .quiz-item {
            background: #FAFAFA;
            border: 2px solid #E0E0E0;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .quiz-item p {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0;
        }

        .options label {
            display: block;
            background: white;
            border: 2px solid #E0E0E0;
            padding: 10px 15px;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .options label:hover {
            background: #FFF3E0;
            border-color: var(--primary-color);
        }

        .fill-blank-input {
            border: none;
            border-bottom: 2px solid var(--primary-color);
            background: #FFF8E1;
            padding: 4px 8px;
            font-size: 1rem;
            text-align: center;
            width: 140px;
            border-radius: 4px;
            font-weight: bold;
            color: #D84315;
        }

        .btn-submit {
            display: block;

            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #02C39A;
            margin-top: 20px;
        }

        .btn-submit:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #02C39A;
        }

        /* 4) 得分頁面 */
        .score-board {
            text-align: center;
            padding: 30px;
            background: #FFF8E1;
            border-radius: 20px;
            border: 3px dashed var(--secondary-color);
        }

        .score-number {
            font-size: 4rem;
            color: var(--primary-color);
            font-weight: bold;
            margin: 10px 0;
        }

            font-size: 0.95rem;

        }

        @media (max-width: 600px) {
            .tab-btn { font-size: 0.9rem; padding: 8px 14px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    
    const btnIndex = parseInt(tabId.replace('tab', '')) - 1;
    document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
    
    window.scrollTo(0, 0);
}

// 🔊 Web Speech API 廣東話朗讀功能
function speakCantonese(index) {
    if (!('speechSynthesis' in window)) {
        alert("很抱歉，您的瀏覽器不支援語音朗讀功能。");
        return;
    }

    // 先停止目前的朗讀
    window.speechSynthesis.cancel();

    const item = vocabulary[index];
    // 組成語音朗讀文本
    const textToSpeak = `${item.word}。解釋：${item.meaning}。例句：${item.sentence}`;

    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    
    // 設定為廣東話 (zh-HK)
    utterance.lang = 'zh-HK';
    utterance.rate = 0.85; // 稍微放慢速度方便小朋友聽清楚

    // 播放語音
    window.speechSynthesis.speak(utterance);
}

// 渲染 Tab 1

    container.innerHTML = vocabulary.map((item, index) => `

                <p><strong>【解釋】：</strong>${item.meaning}</p>

            </div>
            <div class="action-btns">
                <button class="btn-sound" onclick="speakCantonese(${index})">
                    🔊 廣東話語音朗讀 (Sound)
                </button>
                <button class="btn-canto-toggle" onclick="toggleCanto(${index})">
                    📝 廣東話文字對照
                </button>
                <div class="canto-box" id="canto-box-${index}">
                    <p style="margin: 4px 0;"><strong>【粵語解釋】：</strong>${item.cantoMeaning}</p>
                    <p style="margin: 4px 0;"><strong>【粵語例句】：</strong>${item.cantoSentence}</p>
                </div>
            </div>
        </div>
    `).join('');
}

function toggleCanto(index) {
    const box = document.getElementById(`canto-box-${index}`);
    if (box.style.display === "block") {
        box.style.display = "none";
    } else {
        box.style.display = "block";
    }
}

// 渲染 Tab 2
function renderTab2() {
    const form = document.getElementById('mc-form');
    form.innerHTML = mcQuestions.map((q, idx) => `
        <div class="quiz-item">
            <p>${q.q}</p>
            <div class="options">
                ${q.options.map(opt => `
                    <label>
                        <input type="radio" name="mc_${idx}" value="${opt}"> ${opt}
                    </label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

// 渲染 Tab 3
function renderTab3() {
    const form = document.getElementById('fill-form');
    form.innerHTML = fillQuestions.map((q, idx) => `
        <div class="quiz-item">
            <p>${q.q.replace('（    ）', `<input type="text" class="fill-blank-input" id="fill_${idx}" placeholder="請填寫">`)}</p>
        </div>
    `).join('');
}

// 計算分數
function calculateFinalScore() {
    let score = 0;
    let feedback = "<strong>📝 答題檢討：</strong><br>";

    mcQuestions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="mc_${idx}"]:checked`);
        const userAns = selected ? selected.value : "未作答";
        if (userAns === q.answer) {
            score += 10;
            feedback += `<span style="color:green;">✓ 選擇題 ${idx+1} 正確 (+10分)</span><br>`;
        } else {
            feedback += `<span style="color:red;">✗ 選擇題 ${idx+1} 錯誤（你選了：${userAns}，正確答案：${q.answer}）</span><br>`;
        }
    });

    fillQuestions.forEach((q, idx) => {
        const inputEl = document.getElementById(`fill_${idx}`);
        const userAns = inputEl ? inputEl.value.trim() : "";
        if (userAns === q.ans) {
            score += 10;
            feedback += `<span style="color:green;">✓ 填充題 ${idx+1} 正確 (+10分)</span><br>`;
        } else {
            feedback += `<span style="color:red;">✗ 填充題 ${idx+1} 錯誤（你填寫：${userAns || "空白"}，正確答案：${q.ans}）</span><br>`;
        }
    });

    document.getElementById('total-score').innerText = score;
    const commentEl = document.getElementById('score-comment');
    const badgeEl = document.getElementById('badge-icon');

    if (score === 100) {
        badgeEl.innerText = "🎂 👑";
        commentEl.innerText = "太厲害啦！你係最高榮譽嘅『甜品大師傅』！全部答對！";
    } else if (score >= 80) {
        badgeEl.innerText = "🍰";
        commentEl.innerText = "好棒啊！獲得『高級糕點師』稱號，繼續努力！";
    } else if (score >= 60) {
        badgeEl.innerText = "🍩";
        commentEl.innerText = "合格了！獲得『甜品學徒』獎牌，再溫習一下會更好！";
    } else {
        badgeEl.innerText = "🍪";
        commentEl.innerText = "加油啊！返去『詞義與例句』頁面睇多幾次，重新挑戰啦！";
    }

    document.getElementById('detail-feedback').innerHTML = feedback;
    switchTab('tab4');
}
</script>
</body>
